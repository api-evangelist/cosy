name: COSY
description: COSY (CosyRobo) is a retail-technology robotics company that builds autonomous
  inventory robots for physical stores. Its flagship robot, SCOUT, roams store aisles
  using AI and machine vision to scan shelves, map products, audit stock levels, and
  check planogram compliance, feeding the results into a cloud-based management system
  so retailers can reduce out-of-stocks and improve on-shelf availability. Backed by
  500 Global, the company was added to the API Evangelist network as a portfolio lead;
  it publishes a marketing website but does not currently expose a public developer
  API, documentation, or SDKs.
